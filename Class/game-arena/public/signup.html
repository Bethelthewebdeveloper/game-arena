<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Game Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{display:['Orbitron','sans-serif'],sans:['Outfit','system-ui','sans-serif']}}}}</script>
</head>
<body class="min-h-screen bg-[#070b16] font-sans text-slate-200 antialiased">
  <div class="mx-auto flex min-h-screen max-w-md flex-col justify-center px-4 py-10">
    <a href="/" class="mb-8 inline-flex items-center gap-2 self-start">
      <span class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-cyan-400 to-violet-500 text-slate-950"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 16l8-12 8 12H4z"/></svg></span>
      <span class="font-display text-sm font-bold tracking-wider text-white">GAME ARENA</span>
    </a>
    <h1 class="text-3xl font-semibold text-white">Create your profile</h1>
    <p class="mt-2 text-sm text-slate-400">Join Game Arena and start building progress across every game.</p>
    <form id="form" class="mt-8 space-y-4" novalidate>
      <label class="block text-sm">
        <span class="text-slate-300">Username</span>
        <input name="username" autocomplete="username" required minlength="3" maxlength="20" class="mt-1 w-full rounded-xl border border-white/10 bg-white/5 px-3 py-2.5 outline-none ring-cyan-400 focus:ring-2" />
        <span class="mt-1 block text-xs text-slate-500">3–20 letters, numbers, or underscores.</span>
      </label>
      <label class="block text-sm">
        <span class="text-slate-300">Password</span>
        <input name="password" type="password" autocomplete="new-password" required minlength="6" class="mt-1 w-full rounded-xl border border-white/10 bg-white/5 px-3 py-2.5 outline-none ring-cyan-400 focus:ring-2" />
      </label>
      <p id="error" class="hidden text-sm text-rose-300" role="alert"></p>
      <button class="w-full rounded-xl bg-gradient-to-r from-cyan-400 to-violet-500 py-2.5 text-sm font-semibold text-slate-950">Sign up</button>
    </form>
    <p class="mt-6 text-sm text-slate-400">Already playing? <a class="text-cyan-300 hover:underline" id="login-link" href="/login">Log in</a></p>
  </div>
  <script src="/js/arena.js"></script>
  <script>
    const next = Arena.nextFromQuery();
    document.getElementById("login-link").href = "/login?next=" + encodeURIComponent(next);
    Arena.getMe().then((u) => { if (u) location.replace(next); });
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const err = document.getElementById("error");
      err.classList.add("hidden");
      try {
        const res = await fetch("/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: fd.get("username"), password: fd.get("password") }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          err.textContent = data.error || "Could not create account.";
          err.classList.remove("hidden");
          return;
        }
        location.href = next;
      } catch {
        err.textContent = "Could not reach the server. Try again.";
        err.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
