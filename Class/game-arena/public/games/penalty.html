<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Penalty Shootout — Game Arena</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .pitch{background:repeating-linear-gradient(90deg,#1a6b32 0 12%,#16602c 12% 24%),#16602c}
    .net{background-image:linear-gradient(rgba(255,255,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.18) 1px,transparent 1px);background-size:14px 14px}
    .keeper{position:absolute;bottom:18%;left:50%;width:30%;max-width:128px;transform:translateX(-50%);transform-origin:50% 80%;transition:transform .38s cubic-bezier(.2,.7,.2,1);pointer-events:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
    .keeper.dive-left{transform:translateX(-145%) rotate(-18deg)}
    .keeper.dive-center{transform:translateX(-50%) translateY(-6%) scale(1.04)}
    .keeper.dive-right{transform:translateX(45%) rotate(18deg)}
    .ball{position:absolute;width:28px;height:28px;border-radius:999px;left:50%;bottom:8%;transform:translateX(-50%);background:radial-gradient(circle at 30% 30%,#fff 0 35%,#d6d6d6 36% 100%);box-shadow:0 4px 0 rgba(0,0,0,.25);transition:left .42s ease,bottom .42s ease,transform .42s ease;z-index:4}
    .ball.fly-left{left:18%;bottom:58%;transform:translateX(-50%) scale(.72) rotate(160deg)}
    .ball.fly-center{left:50%;bottom:62%;transform:translateX(-50%) scale(.7) rotate(120deg)}
    .ball.fly-right{left:82%;bottom:58%;transform:translateX(-50%) scale(.72) rotate(-160deg)}
    .flash{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;letter-spacing:.08em;pointer-events:none;z-index:6;text-shadow:0 2px 16px rgba(0,0,0,.6)}
  </style>
</head>
<body class="min-h-screen bg-[#07140f] font-sans text-slate-200">
  <main class="mx-auto max-w-xl px-4 py-6">
    <p class="text-xs uppercase tracking-widest text-emerald-300">Game Arena · Penalty Shootout</p>
    <h1 class="mt-1 text-2xl font-semibold text-white">Take the kick</h1>
    <section id="lobby" class="mt-5 space-y-3">
      <select id="mode" class="min-h-11 w-full rounded-xl border border-emerald-400/20 bg-black/30 px-3">
        <option value="five">5-Shot Shootout</option>
        <option value="quick">Quick Penalty</option>
        <option value="sudden">Sudden Death</option>
        <option value="career">Career — 5 shots, need 3</option>
        <option value="challenge">Challenge — keeper reads you more</option>
      </select>
      <button id="go" class="min-h-12 w-full rounded-xl bg-emerald-400 font-semibold text-slate-950">Walk to the spot</button>
    </section>
    <section id="play" hidden>
      <p class="text-sm text-emerald-100/80">Shot <span id="shotn">1</span> · You <span id="goals">0</span> · Keeper <span id="saves">0</span></p>
      <div class="relative mt-3 overflow-hidden rounded-2xl border border-emerald-400/20 pitch" style="height:320px">
        <div class="absolute inset-x-[8%] top-[6%] h-[58%] rounded-t-md border-x-4 border-t-4 border-white/80 net"></div>
        <div class="absolute left-1/2 top-[62%] h-[38%] w-px -translate-x-1/2 bg-white/30"></div>
        <div class="absolute bottom-[8%] left-1/2 h-16 w-40 -translate-x-1/2 rounded-t-full border border-white/25"></div>
        <img id="keeper" class="keeper" src="/assets/goalkeeper.webp" alt="Goalkeeper" onerror="this.src='/assets/goalkeeper.png'" />
        <div id="ball" class="ball"></div>
        <div id="flash" class="flash text-3xl text-white" hidden></div>
        <button data-dir="left" class="absolute left-[8%] top-[10%] z-5 h-[52%] w-[28%]" aria-label="Shoot left"></button>
        <button data-dir="center" class="absolute left-[36%] top-[10%] z-5 h-[52%] w-[28%]" aria-label="Shoot center"></button>
        <button data-dir="right" class="absolute left-[64%] top-[10%] z-5 h-[52%] w-[28%]" aria-label="Shoot right"></button>
      </div>
      <div class="mt-3 grid grid-cols-3 gap-2">
        <button data-dir="left" class="min-h-12 rounded-xl bg-emerald-400/20 font-semibold">Left</button>
        <button data-dir="center" class="min-h-12 rounded-xl bg-emerald-400/20 font-semibold">Center</button>
        <button data-dir="right" class="min-h-12 rounded-xl bg-emerald-400/20 font-semibold">Right</button>
      </div>
      <p id="msg" class="mt-3 text-sm">Tap a side of the goal.</p>
    </section>
    <section id="result" hidden class="mt-6 rounded-2xl border border-emerald-400/20 p-5">
      <h2 class="text-xl font-semibold text-white">SHOOTOUT COMPLETE</h2>
      <p id="rbody" class="mt-3 text-sm leading-7"></p>
      <div class="mt-4 flex flex-wrap gap-2">
        <button id="again" class="min-h-11 rounded-xl bg-emerald-400 px-4 font-semibold text-slate-950">Play Again</button>
        <a href="/dashboard" class="min-h-11 inline-flex items-center rounded-xl border border-white/15 px-4">Back to Games</a>
      </div>
    </section>
  </main>
  <script src="/js/arena.js"></script>
  <script src="/js/game-shell.js"></script>
  <script>
    GameShell.mountChrome("PENALTY SHOOTOUT");
    GameShell.guard();
    const keeper=document.getElementById("keeper"), ball=document.getElementById("ball"), flash=document.getElementById("flash");
    const dirs=["left","center","right"];
    let S, busy=false, lastAim=null;
    function resetPitch(){ keeper.className="keeper"; ball.className="ball"; flash.hidden=true; }
    document.getElementById("go").onclick=()=>{
      GameShell.resetSubmit();
      const mode=document.getElementById("mode").value;
      S={mode,shot:0,goals:0,saves:0,need: mode==="quick"?1:5, done:false};
      document.getElementById("lobby").hidden=true;
      document.getElementById("result").hidden=true;
      document.getElementById("play").hidden=false;
      document.getElementById("goals").textContent=0;
      document.getElementById("saves").textContent=0;
      document.getElementById("shotn").textContent=1;
      resetPitch(); busy=false;
    };
    document.getElementById("again").onclick=()=>{ document.getElementById("lobby").hidden=false; document.getElementById("play").hidden=true; document.getElementById("result").hidden=true; };
    document.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>shoot(b.dataset.dir));
    async function shoot(aim){
      if(busy||!S||S.done) return; busy=true; resetPitch();
      let dive=dirs[Math.floor(Math.random()*3)];
      if(S.mode==="challenge" && lastAim && Math.random()<0.45) dive=lastAim;
      lastAim=aim;
      requestAnimationFrame(()=>{ keeper.classList.add("dive-"+dive); ball.classList.add("fly-"+aim); });
      await new Promise(r=>setTimeout(r,430));
      const saved=aim===dive;
      const wide=!saved && Math.random()<0.07;
      let out=saved?"SAVE": wide?"MISS":"GOAL";
      if(out==="GOAL") S.goals+=1; else S.saves+=1;
      S.shot+=1;
      document.getElementById("goals").textContent=S.goals;
      document.getElementById("saves").textContent=S.saves;
      document.getElementById("shotn").textContent=S.shot+1;
      document.getElementById("msg").textContent=out==="GOAL"?"Goal!": out==="SAVE"?"Saved!":"Wide.";
      flash.hidden=false; flash.textContent=out; flash.style.color=out==="GOAL"?"#86efac":out==="SAVE"?"#fda4af":"#fde68a";
      const overFive=S.mode!=="sudden" && S.shot>=S.need;
      const suddenOver=S.mode==="sudden" && S.shot>=2 && S.goals!==S.saves;
      const careerFail=S.mode==="career" && S.shot===5 && S.goals<3;
      if(overFive || suddenOver || careerFail || (S.mode==="quick" && S.shot>=1)){
        S.done=true;
        document.getElementById("rbody").textContent="Mode "+S.mode+" · Goals "+S.goals+" · Saves/miss "+S.saves;
        document.getElementById("result").hidden=false;
        await GameShell.submitRun("penalty", S.goals, 0, 0, { completed:S.goals>=(S.mode==="quick"?1:3), stage:S.shot, mode:S.mode });
      } else setTimeout(()=>{ resetPitch(); busy=false; },650);
      if(S.done) busy=false;
    }
  </script>
</body>
</html>
