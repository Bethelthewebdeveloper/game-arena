<!DOCTYPE html>
<html lang="en">
<head>
  <script>!function(w,d,s,u,n,a,b){if(w[n])return;a=w[n]={q:[],t:+new Date,s:[],o:u,track:function(){a.q.push([+new Date].concat([].slice.call(arguments)))},setScope:function(){a.s=[].slice.call(arguments).filter(function(x){return typeof x==="string"});a.q.push([+new Date,"setScope"].concat(a.s))},scope:function(){var c=[].slice.call(arguments);return{track:function(){a.q.push([+new Date].concat([].slice.call(arguments)).concat([{__scope:c}]))}}}};b=d.createElement(s);b.async=1;b.src=u+"/s.js";d.getElementsByTagName(s)[0].parentNode.insertBefore(b,d.getElementsByTagName(s)[0])}(window,document,"script","https://t.whop.tw","whop");whop.setScope("biz_zI77NtsVMXsSId");whop.track("page");</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Games — Game Arena Studio</title>
  <link rel="icon" href="/icons/favicon-32.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{display:['Orbitron','sans-serif'],sans:['Outfit','system-ui','sans-serif']}}}}</script>
</head>
<body class="min-h-screen bg-[#070b16] font-sans text-slate-200 antialiased">
  <header class="border-b border-white/10">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
      <a href="/" class="inline-flex"><img src="/brand/logo-wordmark.png" alt="Game Arena" class="h-8 w-auto" /></a>
      <nav class="flex gap-2 text-sm">
        <a href="/studio" class="rounded-lg px-3 py-1.5 hover:bg-white/5">Studio</a>
        <a href="/dashboard" class="rounded-lg px-3 py-1.5 hover:bg-white/5">Arena</a>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-4 py-10">
    <h1 class="font-display text-3xl text-white">COMMUNITY GAMES</h1>
    <p class="mt-2 text-slate-400">Only published creator games appear here. Popularity is based on real plays and likes.</p>
    <form id="search" class="mt-6 flex flex-wrap gap-2">
      <input id="q" class="min-h-11 flex-1 rounded-xl border border-white/10 bg-white/5 px-3" placeholder="Search title, creator, or category" />
      <button class="min-h-11 rounded-xl bg-cyan-400 px-4 font-semibold text-slate-950">Search</button>
    </form>
    <div id="sorts" class="mt-4 flex flex-wrap gap-2"></div>
    <div id="cats" class="mt-3 flex flex-wrap gap-2"></div>
    <section id="grid" class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></section>
  </main>
  <script>
    const sorts = ["New", "Trending", "Popular", "Recently Played", "Recommended"];
    const cats = ["Puzzle", "Arcade", "Quiz", "Strategy", "Adventure", "Casual"];
    let sort = "New";
    let cat = "";
    let query = "";
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&", "<": "<", ">": ">", '"': """, "'": "&#39;" }[c])); }
    function thumb(g) {
      const preview = g.preview || { bg: "#0b1220", dots: [] };
      const dots = (preview.dots || []).map((d) => `<span style="left:${Number(d.x)||0}%;top:${Number(d.y)||0}%;background:${esc(d.c)}" class="absolute h-2.5 w-2.5 -translate-x-1/2 -translate-y-1/2 rounded-sm"></span>`).join("");
      return `<div class="relative h-28 overflow-hidden rounded-xl border border-white/10" style="background:${esc(preview.bg)}">${dots}</div>`;
    }
    function paint() {
      document.getElementById("sorts").innerHTML = sorts.map((c) => `<button data-s="${c}" class="min-h-10 rounded-full border px-3 py-1 text-sm ${c === sort && !cat ? "border-cyan-300 bg-cyan-400/15 text-white" : "border-white/15"}">${c}</button>`).join("");
      document.getElementById("cats").innerHTML = cats.map((c) => `<button data-c="${c}" class="min-h-10 rounded-full border px-3 py-1 text-sm ${c === cat ? "border-cyan-300 bg-cyan-400/15 text-white" : "border-white/15"}">${c}</button>`).join("");
    }
    async function load() {
      paint();
      const params = new URLSearchParams();
      if (cat) params.set("category", cat);
      else params.set("sort", sort === "Recently Played" ? "recent" : sort.toLowerCase());
      if (query) params.set("q", query);
      const res = await fetch("/api/studio/community?" + params.toString(), { credentials: "same-origin" });
      const data = await res.json();
      const games = data.games || [];
      document.getElementById("grid").innerHTML = games.length ? games.map((g) => `
        <article class="rounded-2xl border border-white/10 bg-white/[0.03] p-4">
          ${thumb(g)}
          <h2 class="mt-3 font-semibold text-white">${esc(g.title)}</h2>
          <p class="text-xs text-slate-400"><a class="text-cyan-300" href="/u/${encodeURIComponent(g.creatorName)}">${esc(g.creatorName)}</a> · ${esc(g.category)}</p>
          <p class="mt-1 text-xs text-slate-500">${g.plays || 0} plays · ${g.likes || 0} likes</p>
          <a class="mt-3 inline-flex min-h-11 items-center rounded-lg bg-cyan-400/15 px-3 py-2 text-sm text-cyan-100" href="${esc(g.url)}">Play</a>
        </article>`).join("") : `<p class="text-sm text-slate-500">No published games in this category yet.</p>`;
    }
    document.getElementById("sorts").onclick = (e) => { const b = e.target.closest("[data-s]"); if (!b) return; sort = b.dataset.s; cat = ""; load(); };
    document.getElementById("cats").onclick = (e) => { const b = e.target.closest("[data-c]"); if (!b) return; cat = b.dataset.c; load(); };
    document.getElementById("search").onsubmit = (e) => { e.preventDefault(); query = document.getElementById("q").value.trim(); load(); };
    load();
  </script>
</body>
</html>
