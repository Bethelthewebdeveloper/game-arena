<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Mini Race — Game Arena</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    canvas { touch-action: none; background: #0b1a12; }
    .pad { min-height: 52px; }
  </style>
</head>
<body class="min-h-screen bg-[#07140f] font-sans text-slate-200">
  <main class="mx-auto max-w-xl px-4 py-6">
    <p class="text-xs uppercase tracking-widest text-orange-300">Game Arena · Mini Race</p>
    <h1 class="mt-1 text-2xl font-semibold text-white">Mini Race</h1>
    <p class="mt-1 text-sm text-slate-400">Drive the car. Beat the clock. Finish ahead of the pack.</p>

    <section id="lobby" class="mt-5 space-y-3">
      <label class="block text-sm">Mode
        <select id="mode" class="mt-1 w-full min-h-12 rounded-xl border border-orange-400/25 bg-[#0b1a14] px-3">
          <option value="quick">Quick Race</option>
          <option value="time-trial">Time Trial</option>
          <option value="checkpoint">Checkpoint Rush</option>
          <option value="obstacle" disabled>Obstacle Race — Coming Soon</option>
          <option value="survival" disabled>Survival — Coming Soon</option>
          <option value="championship" disabled>Championship — Coming Soon</option>
        </select>
      </label>
      <label class="block text-sm">Stage (1–50)
        <input id="stage" type="number" min="1" max="50" value="1" class="mt-1 w-full min-h-12 rounded-xl border border-orange-400/25 bg-[#0b1a14] px-3" />
      </label>
      <p id="obj" class="text-sm text-orange-100/80"></p>
      <p id="best" class="text-xs text-slate-500"></p>
      <p id="lock" class="hidden rounded-xl border border-amber-400/25 bg-amber-400/10 p-3 text-sm">
        Stages 21–50 are planned for Game Arena Pro.
        <button type="button" id="wl-btn" class="mt-2 block min-h-11 w-full rounded-xl bg-amber-400 font-semibold text-slate-950">Join the waitlist</button>
      </p>
      <button id="start" class="w-full min-h-12 rounded-xl bg-orange-400 font-semibold text-slate-950">Start race</button>
    </section>

    <section id="play" hidden>
      <div class="mb-2 grid grid-cols-2 gap-1 text-xs sm:grid-cols-4 sm:text-sm">
        <span id="hud-stage"></span>
        <span id="hud-pos"></span>
        <span id="hud-time"></span>
        <span id="hud-spd"></span>
      </div>
      <div class="relative">
        <canvas id="cv" width="360" height="520" class="w-full rounded-2xl border border-orange-400/20"></canvas>
        <div id="count" class="pointer-events-none absolute inset-0 grid place-items-center text-6xl font-bold text-orange-200"></div>
      </div>
      <div class="mt-3 grid grid-cols-4 gap-2">
        <button class="pad rounded-xl bg-white/10" data-k="left" aria-label="Steer left">◀</button>
        <button class="pad rounded-xl bg-orange-400 text-slate-950 font-semibold" data-k="up" aria-label="Accelerate">GAS</button>
        <button class="pad rounded-xl bg-white/10" data-k="down" aria-label="Brake">BRAKE</button>
        <button class="pad rounded-xl bg-white/10" data-k="right" aria-label="Steer right">▶</button>
      </div>
      <button id="abort" class="mt-3 text-sm text-slate-400">Back to Games</button>
    </section>

    <section id="result" hidden class="mt-6 rounded-2xl border border-orange-400/20 p-5">
      <h2 id="rtitle" class="text-xl font-semibold text-white">RACE COMPLETE</h2>
      <p id="result-body" class="mt-3 text-sm leading-7 text-slate-300"></p>
      <p id="result-err" class="mt-2 hidden text-sm text-rose-300"></p>
      <div class="mt-4 flex flex-wrap gap-2">
        <button id="retry" class="min-h-11 rounded-xl bg-orange-400 px-4 font-semibold text-slate-950">Play Again</button>
        <button id="next" class="min-h-11 rounded-xl border border-white/15 px-4">Next Stage</button>
        <a href="/dashboard" class="min-h-11 inline-flex items-center rounded-xl border border-white/15 px-4">Back to Games</a>
      </div>
    </section>
  </main>
  <script src="/js/arena.js"></script>
  <script src="/js/game-shell.js"></script>
  <script>
    GameShell.mountChrome("MINI RACE");
    const TRACKS = ["beginner", "city", "sharp", "obstacle", "speed", "technical"];
    let player = null, unlocked = 1, bestTime = null, submitted = false;
    GameShell.guard().then((u) => {
      player = u;
      if (!u) return;
      const st = (u.stats && u.stats.minirace) || {};
      unlocked = Math.max(1, st.stage || 1);
      bestTime = st.bestTime == null ? null : st.bestTime;
      document.getElementById("stage").value = Math.min(50, unlocked);
      document.getElementById("best").textContent = bestTime == null ? "No best time yet." : ("Best time: " + Number(bestTime).toFixed(2) + "s");
      describe();
    });

    function trackName(stage) { return TRACKS[(stage - 1) % TRACKS.length]; }
    function describe() {
      const stage = Number(document.getElementById("stage").value) || 1;
      const mode = document.getElementById("mode").value;
      const lock = stage > 20 && (!player || player.plan !== "pro");
      document.getElementById("lock").classList.toggle("hidden", !lock);
      document.getElementById("start").disabled = lock;
      const bits = {
        quick: "Finish ahead of the AI on " + trackName(stage) + " circuit.",
        "time-trial": "Beat the target time. No AI pack.",
        checkpoint: "Hit every checkpoint before time runs out."
      };
      document.getElementById("obj").textContent = "Stage " + stage + " · " + (bits[mode] || "");
    }
    document.getElementById("mode").onchange = describe;
    document.getElementById("stage").oninput = describe;
    document.getElementById("wl-btn").onclick = () => Arena.openWaitlist(player, "minirace-pro-stage");

    const keys = { left: false, right: false, up: false, down: false };
    window.addEventListener("keydown", (e) => {
      if (["ArrowLeft", "a", "A"].includes(e.key)) keys.left = true;
      if (["ArrowRight", "d", "D"].includes(e.key)) keys.right = true;
      if (["ArrowUp", "w", "W"].includes(e.key)) keys.up = true;
      if (["ArrowDown", "s", "S"].includes(e.key)) keys.down = true;
    });
    window.addEventListener("keyup", (e) => {
      if (["ArrowLeft", "a", "A"].includes(e.key)) keys.left = false;
      if (["ArrowRight", "d", "D"].includes(e.key)) keys.right = false;
      if (["ArrowUp", "w", "W"].includes(e.key)) keys.up = false;
      if (["ArrowDown", "s", "S"].includes(e.key)) keys.down = false;
    });
    document.querySelectorAll("[data-k]").forEach((btn) => {
      const set = (v) => { keys[btn.dataset.k] = v; };
      btn.addEventListener("pointerdown", (e) => { e.preventDefault(); set(true); });
      btn.addEventListener("pointerup", () => set(false));
      btn.addEventListener("pointerleave", () => set(false));
    });

    const cv = document.getElementById("cv");
    const ctx = cv.getContext("2d");
    let raf, state;
    window.__gaCleanup = () => { if (raf) cancelAnimationFrame(raf); if (state) state.done = true; };

    function cfgFor(stage, mode) {
      const track = trackName(stage);
      let width = track === "sharp" || track === "technical" ? Math.max(78, 150 - stage) : Math.max(92, 176 - stage * 1.2);
      let length = 1100 + stage * 26;
      let hazards = track === "obstacle" ? 6 + Math.floor(stage / 2) : 2 + Math.floor(stage / 3);
      let moving = stage >= 4 || track === "city";
      let ai = mode === "time-trial" ? 0 : (stage === 1 ? 1 : Math.min(3, 1 + Math.floor(stage / 5)));
      let limit = mode === "time-trial" ? 28 + stage * 0.4 : mode === "checkpoint" ? 26 + stage * 0.35 : 0;
      if (mode === "quick") { length = 820 + stage * 14; hazards = Math.max(1, hazards - 2); }
      if (mode === "checkpoint") { length += 180; }
      if (track === "speed") length += 200;
      return { n: stage, width, length, hazards, moving, speed: 2.3 + stage * 0.03, mode, track, ai, limit };
    }

    function buildWorld(cfg) {
      const segs = [];
      let cx = 180;
      const twist = cfg.track === "sharp" || cfg.track === "technical" ? 55 : 95;
      for (let y = 0; y <= cfg.length + 80; y += 24) {
        cx += Math.sin(y / twist) * (cfg.track === "beginner" ? 4 : 7 + cfg.n * 0.1);
        cx = Math.max(70, Math.min(290, cx));
        segs.push({ y, cx, w: cfg.width - (cfg.track === "technical" && y % 180 < 40 ? 18 : 0) });
      }
      const obstacles = [];
      for (let i = 0; i < cfg.hazards; i++) {
        const y = 200 + (cfg.length - 280) * ((i + 1) / (cfg.hazards + 1));
        const seg = segs[Math.min(segs.length - 1, Math.floor(y / 24))];
        obstacles.push({
          x: seg.cx + ((i % 3) - 1) * (seg.w * 0.26),
          y, r: 11,
          vx: cfg.moving ? (i % 2 ? 1 : -1) * (0.8 + cfg.n * 0.02) : 0
        });
      }
      const checks = [];
      const count = cfg.mode === "checkpoint" ? 4 : 2;
      for (let i = 1; i <= count; i++) checks.push({ y: (cfg.length * i) / (count + 1), hit: false });
      const ai = [];
      for (let i = 0; i < cfg.ai; i++) {
        ai.push({ x: 150 + i * 20, y: 20 + i * 16, speed: cfg.speed * (0.78 + i * 0.06 + cfg.n * 0.008), done: false });
      }
      return { segs, obstacles, checks, ai };
    }

    function wallAt(world, y) {
      const i = Math.max(0, Math.min(world.segs.length - 2, Math.floor(y / 24)));
      return world.segs[i];
    }

    document.getElementById("start").onclick = begin;
    document.getElementById("retry").onclick = begin;
    document.getElementById("next").onclick = () => {
      const s = document.getElementById("stage");
      s.value = Math.min(50, Number(s.value) + 1);
      describe();
      if (Number(s.value) > 20 && (!player || player.plan !== "pro")) {
        document.getElementById("result").hidden = true;
        document.getElementById("lobby").hidden = false;
        return;
      }
      begin();
    };
    document.getElementById("abort").onclick = () => location.href = "/dashboard";

    function begin() {
      GameShell.resetSubmit();
      submitted = false;
      const stage = Math.max(1, Math.min(50, Number(document.getElementById("stage").value) || 1));
      if (stage > 20 && (!player || player.plan !== "pro")) { describe(); return; }
      const mode = document.getElementById("mode").value;
      const cfg = cfgFor(stage, mode);
      state = { cfg, world: buildWorld(cfg), stage, mode, x: 180, y: 40, speed: 0, hits: 0, t0: 0, done: false, dist: 0 };
      document.getElementById("lobby").hidden = true;
      document.getElementById("result").hidden = true;
      document.getElementById("play").hidden = false;
      document.getElementById("hud-stage").textContent = "St " + stage + " · " + cfg.track;
      countdown(3);
    }

    function countdown(n) {
      const el = document.getElementById("count");
      el.textContent = n === 0 ? "GO!" : String(n);
      if (n === 0) { setTimeout(() => { el.textContent = ""; startLoop(); }, 280); return; }
      setTimeout(() => countdown(n - 1), 650);
    }
    function startLoop() {
      state.t0 = performance.now();
      cancelAnimationFrame(raf);
      loop();
    }
    function loop() {
      raf = requestAnimationFrame(loop);
      if (!state || state.done) return;
      step();
      draw();
    }

    function position() {
      const finishedAi = state.world.ai.filter((a) => a.y >= state.cfg.length).length;
      const ahead = state.world.ai.filter((a) => a.y > state.y).length;
      return 1 + ahead;
    }

    function step() {
      const elapsed = (performance.now() - state.t0) / 1000;
      const remain = state.cfg.limit ? Math.max(0, state.cfg.limit - elapsed) : elapsed;
      document.getElementById("hud-time").textContent = (state.cfg.limit ? remain.toFixed(1) + "s left" : elapsed.toFixed(2) + "s");
      document.getElementById("hud-spd").textContent = Math.round(state.speed * 18) + " u";
      document.getElementById("hud-pos").textContent = "P" + position() + " · CP " + state.world.checks.filter((c) => c.hit).length + "/" + state.world.checks.length;
      if (keys.left) state.x -= 3.3;
      if (keys.right) state.x += 3.3;
      if (keys.up) state.speed = Math.min(state.cfg.speed + 2.4, state.speed + 0.14);
      else if (keys.down) state.speed = Math.max(0.4, state.speed - 0.18);
      else state.speed = Math.max(state.cfg.speed * 0.5, state.speed - 0.035);
      state.y += state.speed;
      const seg = wallAt(state.world, state.y);
      const left = seg.cx - seg.w / 2, right = seg.cx + seg.w / 2;
      if (state.x < left + 10 || state.x > right - 10) {
        state.speed *= 0.84;
        state.x = Math.max(left + 8, Math.min(right - 8, state.x));
      }
      state.world.obstacles.forEach((o) => {
        if (o.vx) {
          o.x += o.vx;
          if (o.x < left + 16 || o.x > right - 16) o.vx *= -1;
        }
        const dx = o.x - state.x, dy = o.y - state.y;
        if (dx * dx + dy * dy < (o.r + 12) * (o.r + 12) && Math.abs(dy) < 36) {
          state.speed *= 0.42;
          state.hits += 1;
          o.y -= 36;
        }
      });
      state.world.ai.forEach((a) => {
        if (a.y < state.cfg.length) a.y += a.speed;
        const s = wallAt(state.world, a.y);
        a.x += (s.cx - a.x) * 0.04;
      });
      state.world.checks.forEach((c) => { if (!c.hit && state.y >= c.y) c.hit = true; });
      if (state.cfg.limit && remain <= 0) return finish(false);
      if (state.y >= state.cfg.length) finish(true);
    }

    function finish(won) {
      if (state.done) return;
      state.done = true;
      cancelAnimationFrame(raf);
      const time = (performance.now() - state.t0) / 1000;
      const checksHit = state.world.checks.filter((c) => c.hit).length;
      const checkOk = state.mode !== "checkpoint" || state.world.checks.every((c) => c.hit);
      const completed = !!(won && checkOk);
      const pos = position();
      let score = Math.max(0, Math.floor(2000 - time * 20 - state.hits * 35 - (pos - 1) * 80));
      if (!completed) score = Math.max(0, Math.floor(state.y / 8));
      const pb = bestTime != null && time < bestTime && completed;
      document.getElementById("rtitle").textContent = completed ? "RACE COMPLETE" : "RACE OVER";
      document.getElementById("result-body").innerHTML =
        "Position: P" + pos +
        "<br>Time: " + time.toFixed(2) + "s" +
        "<br>Best time: " + ((completed && (bestTime == null || time < bestTime)) ? time.toFixed(2) : (bestTime == null ? "—" : Number(bestTime).toFixed(2))) + "s" +
        "<br>Stage: " + state.stage + " · " + state.cfg.track +
        "<br>Checkpoints: " + checksHit + "/" + state.world.checks.length +
        "<br>Obstacles hit: " + state.hits +
        (pb ? "<br>New personal best" : "");
      document.getElementById("play").hidden = true;
      document.getElementById("result").hidden = false;
      save(score, completed, time, pos, checksHit);
    }

    async function save(score, completed, time, pos, checksHit) {
      if (submitted) return;
      submitted = true;
      const out = await GameShell.submitRun("minirace", score, 0, 0, {
        stage: state.stage, mode: state.mode, completed, time,
        position: pos, checkpoints: checksHit, obstaclesHit: state.hits
      });
      const err = document.getElementById("result-err");
      if (out.error) { err.hidden = false; err.textContent = out.error; }
      else {
        err.hidden = true;
        if (out.awarded) {
          document.getElementById("result-body").innerHTML += "<br>XP +" + out.awarded.xp + " · Coins +" + out.awarded.coins;
        }
        if (out.user && out.user.stats && out.user.stats.minirace) bestTime = out.user.stats.minirace.bestTime;
      }
    }

    function draw() {
      const w = cv.width, h = cv.height;
      ctx.fillStyle = state.cfg.track === "city" ? "#163022" : "#1f7a3a";
      ctx.fillRect(0, 0, w, h);
      const cam = state.y - 80;
      state.world.segs.forEach((s) => {
        const sy = h - (s.y - cam);
        if (sy < -30 || sy > h + 30) return;
        ctx.fillStyle = "#2a2a2a";
        ctx.fillRect(s.cx - s.w / 2, sy - 13, s.w, 26);
        ctx.fillStyle = "#f5d76e";
        ctx.fillRect(s.cx - 1, sy - 10, 2, 12);
      });
      state.world.checks.forEach((c) => {
        const cy = h - (c.y - cam);
        ctx.fillStyle = c.hit ? "rgba(52,211,153,.45)" : "rgba(251,191,36,.55)";
        ctx.fillRect(20, cy - 4, w - 40, 8);
      });
      const finY = h - (state.cfg.length - cam);
      ctx.fillStyle = "#fff"; ctx.fillRect(0, finY, w, 6);
      ctx.fillStyle = "#111"; ctx.font = "12px Outfit, sans-serif"; ctx.fillText("FINISH", 12, finY - 6);
      state.world.obstacles.forEach((o) => {
        const oy = h - (o.y - cam);
        ctx.fillStyle = "#ef4444";
        ctx.beginPath(); ctx.arc(o.x, oy, o.r, 0, Math.PI * 2); ctx.fill();
      });
      state.world.ai.forEach((a) => {
        const ay = h - (a.y - cam);
        ctx.fillStyle = "#94a3b8";
        ctx.fillRect(a.x - 8, ay - 14, 16, 24);
      });
      const carY = h - (state.y - cam);
      ctx.fillStyle = "#fb923c";
      ctx.fillRect(state.x - 10, carY - 16, 20, 28);
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(state.x - 7, carY - 10, 14, 8);
    }
  </script>
</body>
</html>
