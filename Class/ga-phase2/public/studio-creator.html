<!DOCTYPE html>
<html lang="en">
<head>
  <script>!function(w,d,s,u,n,a,b){if(w[n])return;a=w[n]={q:[],t:+new Date,s:[],o:u,track:function(){a.q.push([+new Date].concat([].slice.call(arguments)))},setScope:function(){a.s=[].slice.call(arguments).filter(function(x){return typeof x==="string"});a.q.push([+new Date,"setScope"].concat(a.s))},scope:function(){var c=[].slice.call(arguments);return{track:function(){a.q.push([+new Date].concat([].slice.call(arguments)).concat([{__scope:c}]))}}}};b=d.createElement(s);b.async=1;b.src=u+"/s.js";d.getElementsByTagName(s)[0].parentNode.insertBefore(b,d.getElementsByTagName(s)[0])}(window,document,"script","https://t.whop.tw","whop");whop.setScope("biz_zI77NtsVMXsSId");whop.track("page");</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creator — Game Arena Studio</title>
  <link rel="icon" href="/icons/favicon-32.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{display:['Orbitron','sans-serif'],sans:['Outfit','system-ui','sans-serif']}}}}</script>
</head>
<body class="min-h-screen bg-[#070b16] font-sans text-slate-200 antialiased">
  <header class="border-b border-white/10">
    <div class="mx-auto flex max-w-4xl items-center justify-between px-4 py-3">
      <a href="/" class="inline-flex"><img src="/brand/logo-wordmark.png" alt="Game Arena" class="h-8 w-auto" /></a>
      <a href="/studio/community" class="text-sm">Community</a>
    </div>
  </header>
  <main class="mx-auto max-w-4xl px-4 py-10">
    <p id="err" class="text-rose-300"></p>
    <div class="flex items-center gap-4">
      <div id="avatar" class="grid h-16 w-16 place-items-center overflow-hidden rounded-full border border-cyan-400/30 bg-cyan-400/10 text-lg font-semibold text-cyan-100"></div>
      <div>
        <h1 id="name" class="font-display text-3xl text-white"></h1>
        <p id="bio" class="mt-1 text-slate-400"></p>
      </div>
    </div>
    <p id="stats" class="mt-4 text-sm text-slate-400"></p>
    <ul id="ach" class="mt-3 flex flex-wrap gap-2 text-xs"></ul>
    <section id="grid" class="mt-8 grid gap-4 sm:grid-cols-2"></section>
  </main>
  <script>
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&", "<": "<", ">": ">", '"': """, "'": "&#39;" }[c])); }
    function thumb(g) {
      const preview = g.preview || { bg: "#0b1220", dots: [] };
      const dots = (preview.dots || []).map((d) => `<span style="left:${Number(d.x)||0}%;top:${Number(d.y)||0}%;background:${esc(d.c)}" class="absolute h-2 w-2 rounded-sm"></span>`).join("");
      return `<div class="relative mb-3 h-20 overflow-hidden rounded-xl border border-white/10" style="background:${esc(preview.bg)}">${dots}</div>`;
    }
    const name = decodeURIComponent(location.pathname.replace(/^\/u\//, "").split("/")[0]);
    fetch("/api/studio/creator/" + encodeURIComponent(name)).then((r) => r.json()).then((data) => {
      if (!data.creator) { document.getElementById("err").textContent = data.error || "Creator not found."; return; }
      const c = data.creator;
      document.getElementById("name").textContent = c.username;
      document.getElementById("bio").textContent = c.bio || "Game Arena creator";
      document.getElementById("stats").textContent = "Lv " + c.level + " · " + c.published + " published · " + c.plays + " plays · " + c.likes + " likes";
      const avatar = document.getElementById("avatar");
      if (c.avatar) avatar.innerHTML = `<img src="${esc(c.avatar)}" alt="" class="h-full w-full object-cover" />`;
      else avatar.textContent = c.initials || "GA";
      document.getElementById("ach").innerHTML = (c.achievements || []).map((id) => `<li class="rounded-full border border-white/15 px-2 py-1">${esc(id)}</li>`).join("");
      document.getElementById("grid").innerHTML = (data.games || []).map((g) => `
        <article class="rounded-2xl border border-white/10 p-4">
          ${thumb(g)}
          <h2 class="font-semibold text-white">${esc(g.title)}</h2>
          <p class="text-xs text-slate-400">${esc(g.category)} · ${g.plays || 0} plays · ${g.likes || 0} likes</p>
          <a class="mt-3 inline-flex min-h-11 items-center text-sm text-cyan-300" href="${esc(g.url)}">Play</a>
        </article>`).join("") || "<p class='text-slate-500'>No published games yet.</p>";
    });
  </script>
</body>
</html>
