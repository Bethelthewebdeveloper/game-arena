<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Mini Race — Game Arena</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Outfit:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    canvas { touch-action: none; background: #0b1a12; }
    .pad { min-height: 52px; min-width: 64px; }
  </style>
</head>
<body class="min-h-screen bg-[#07140f] font-sans text-slate-200">
  <main class="mx-auto max-w-xl px-4 py-8">
    <p class="text-xs uppercase tracking-widest text-orange-300">Game Arena · Mini Race</p>
    <h1 class="mt-2 text-2xl font-semibold text-white">Mini Race</h1>
    <p class="mt-1 text-sm text-slate-400">Steer the car. Stay on the asphalt. Hit the finish.</p>

    <section id="lobby" class="mt-6 space-y-4">
      <label class="block text-sm">Mode
        <select id="mode" class="mt-1 w-full rounded-xl border border-white/10 bg-black/30 px-3 py-2">
          <option value="quick">Quick Race</option>
          <option value="time-trial">Time Trial</option>
          <option value="checkpoint">Checkpoint Rush</option>
          <option value="obstacle">Obstacle Race</option>
          <option value="endless">Endless Race</option>
          <option value="championship">Championship</option>
        </select>
      </label>
      <label class="block text-sm">Stage
        <input id="stage" type="number" min="1" max="50" value="1" class="mt-1 w-full rounded-xl border border-white/10 bg-black/30 px-3 py-2" />
      </label>
      <p id="best" class="text-xs text-slate-500">Best time appears after you finish a race.</p>
      <button id="start" class="w-full rounded-xl bg-orange-400 py-3 font-semibold text-slate-950">Start race</button>
    </section>

    <section id="play" hidden>
      <div class="mb-2 flex justify-between text-sm">
        <span id="hud-stage"></span>
        <span id="hud-time">0.00s</span>
        <span id="hud-prog">0%</span>
      </div>
      <div class="relative">
        <canvas id="cv" width="360" height="520" class="w-full rounded-2xl border border-orange-400/20"></canvas>
        <div id="count" class="pointer-events-none absolute inset-0 grid place-items-center font-display text-6xl text-orange-200"></div>
      </div>
      <div class="mt-3 grid grid-cols-3 gap-2">
        <button class="pad rounded-xl bg-white/10" data-k="left" aria-label="Steer left">◀</button>
        <button class="pad rounded-xl bg-orange-400/80 text-slate-950" data-k="up" aria-label="Accelerate">GAS</button>
        <button class="pad rounded-xl bg-white/10" data-k="right" aria-label="Steer right">▶</button>
      </div>
      <button id="abort" class="mt-3 text-sm text-slate-400">Back to Game Arena</button>
    </section>

    <section id="result" hidden class="mt-6 rounded-2xl border border-orange-400/20 p-5">
      <h2 class="text-xl font-semibold text-white">RACE COMPLETE</h2>
      <p id="result-body" class="mt-3 text-sm text-slate-300"></p>
      <p id="result-err" class="mt-2 hidden text-sm text-rose-300"></p>
      <div class="mt-4 flex flex-wrap gap-2">
        <button id="retry" class="rounded-xl bg-orange-400 px-4 py-2 font-semibold text-slate-950">Retry</button>
        <button id="next" class="rounded-xl border border-white/15 px-4 py-2">Next Stage</button>
        <a href="/dashboard" class="rounded-xl border border-white/15 px-4 py-2">Back to Game Arena</a>
      </div>
    </section>
  </main>
  <script src="/js/arena.js"></script>
  <script src="/js/game-shell.js"></script>
  <script>
    GameShell.mountChrome("MINI RACE");
    let player = null, unlocked = 1, bestTime = null, submitted = false;
    GameShell.guard().then((u) => {
      player = u;
      if (!u) return;
      const st = (u.stats && u.stats.minirace) || {};
      unlocked = Math.max(1, st.stage || 1);
      bestTime = st.bestTime == null ? null : st.bestTime;
      document.getElementById("stage").max = 50;
      document.getElementById("stage").value = unlocked;
      document.getElementById("best").textContent = bestTime == null ? "No best time saved yet." : ("Best time: " + bestTime.toFixed(2) + "s");
    });

    const keys = { left: false, right: false, up: false };
    window.addEventListener("keydown", (e) => {
      if (["ArrowLeft", "a", "A"].includes(e.key)) keys.left = true;
      if (["ArrowRight", "d", "D"].includes(e.key)) keys.right = true;
      if (["ArrowUp", "w", "W"].includes(e.key)) keys.up = true;
    });
    window.addEventListener("keyup", (e) => {
      if (["ArrowLeft", "a", "A"].includes(e.key)) keys.left = false;
      if (["ArrowRight", "d", "D"].includes(e.key)) keys.right = false;
      if (["ArrowUp", "w", "W"].includes(e.key)) keys.up = false;
    });
    document.querySelectorAll("[data-k]").forEach((btn) => {
      const set = (v) => { keys[btn.dataset.k] = v; };
      btn.addEventListener("pointerdown", (e) => { e.preventDefault(); set(true); });
      btn.addEventListener("pointerup", () => set(false));
      btn.addEventListener("pointerleave", () => set(false));
    });

    const cv = document.getElementById("cv");
    const ctx = cv.getContext("2d");
    let raf, state;
    window.__gaCleanup = () => { if (raf) cancelAnimationFrame(raf); if (state) state.done = true; };

    function cfgFor(stage, mode) {
      const n = stage;
      let width = Math.max(88, 176 - n * 1.5);
      let length = 1200 + n * 28;
      let hazards = 3 + Math.floor(n / 2);
      let moving = n >= 21;
      let speed = 2.4 + n * 0.035;
      if (mode === "quick") { length = 820 + n * 12; hazards = Math.max(2, hazards - 3); }
      if (mode === "time-trial") { moving = false; hazards = Math.max(1, Math.floor(hazards / 2)); }
      if (mode === "obstacle") { hazards += 6; moving = n >= 11; }
      if (mode === "checkpoint") { length += 200; }
      if (mode === "endless") { length = 4000; }
      if (mode === "championship") { length += 400; }
      return { n, width, length, hazards, moving, speed, mode };
    }

    function buildWorld(cfg) {
      const segs = [];
      let cx = 180;
      for (let y = 0; y <= cfg.length + 80; y += 24) {
        cx += Math.sin(y / (90 - Math.min(40, cfg.n))) * (6 + cfg.n * 0.12);
        cx = Math.max(70, Math.min(290, cx));
        segs.push({ y, cx, w: cfg.width });
      }
      const obstacles = [];
      for (let i = 0; i < cfg.hazards; i++) {
        const y = 180 + (cfg.length - 260) * ((i + 1) / (cfg.hazards + 1));
        const seg = segs[Math.min(segs.length - 1, Math.floor(y / 24))];
        const lane = (i % 3) - 1;
        obstacles.push({
          x: seg.cx + lane * (seg.w * 0.28),
          y,
          r: cfg.n >= 41 ? 11 : 14,
          vx: cfg.moving ? (i % 2 ? 1.1 : -1.1) * (1 + cfg.n * 0.02) : 0
        });
      }
      const checks = [];
      if (cfg.mode === "checkpoint") {
        for (let i = 1; i <= 3; i++) checks.push({ y: (cfg.length * i) / 4, hit: false });
      }
      return { segs, obstacles, checks };
    }

    function wallAt(world, y) {
      const i = Math.max(0, Math.min(world.segs.length - 2, Math.floor(y / 24)));
      return world.segs[i];
    }

    document.getElementById("start").onclick = () => begin();
    document.getElementById("retry").onclick = () => begin();
    document.getElementById("next").onclick = () => {
      const s = document.getElementById("stage");
      s.value = Math.min(50, Number(s.value) + 1);
      begin();
    };
    document.getElementById("abort").onclick = () => location.href = "/dashboard";

    function begin() {
      submitted = false;
      const stage = Math.max(1, Math.min(50, Number(document.getElementById("stage").value) || 1));
      const mode = document.getElementById("mode").value;
      const cfg = cfgFor(stage, mode);
      const world = buildWorld(cfg);
      state = {
        cfg, world, stage, mode,
        x: 180, y: 40, speed: 0, hits: 0, off: 0,
        t0: 0, running: false, done: false, won: false,
        dist: 0, lives: 3
      };
      document.getElementById("lobby").hidden = true;
      document.getElementById("result").hidden = true;
      document.getElementById("play").hidden = false;
      document.getElementById("hud-stage").textContent = "Stage " + stage + " · " + mode;
      countdown(3);
    }

    function countdown(n) {
      const el = document.getElementById("count");
      el.textContent = n === 0 ? "GO!" : String(n);
      if (n === 0) {
        setTimeout(() => { el.textContent = ""; startLoop(); }, 350);
        return;
      }
      setTimeout(() => countdown(n - 1), 700);
    }

    function startLoop() {
      state.running = true;
      state.t0 = performance.now();
      cancelAnimationFrame(raf);
      loop();
    }

    function loop() {
      raf = requestAnimationFrame(loop);
      if (!state || state.done) return;
      step();
      draw();
    }

    function step() {
      const now = performance.now();
      const elapsed = (now - state.t0) / 1000;
      document.getElementById("hud-time").textContent = elapsed.toFixed(2) + "s";
      if (keys.left) state.x -= 3.2;
      if (keys.right) state.x += 3.2;
      if (keys.up) state.speed = Math.min(state.cfg.speed + 2.2, state.speed + 0.12);
      else state.speed = Math.max(state.cfg.speed * 0.55, state.speed - 0.04);
      state.y += state.speed;
      state.dist = state.y;
      const seg = wallAt(state.world, state.y);
      const left = seg.cx - seg.w / 2;
      const right = seg.cx + seg.w / 2;
      if (state.x < left + 10 || state.x > right - 10) {
        state.speed *= 0.86;
        state.off += 1;
        state.x = Math.max(left + 8, Math.min(right - 8, state.x));
      }
      state.world.obstacles.forEach((o) => {
        if (o.vx) {
          o.x += o.vx;
          if (o.x < left + 16 || o.x > right - 16) o.vx *= -1;
        }
        const dx = o.x - state.x, dy = o.y - state.y;
        if (dx * dx + dy * dy < (o.r + 12) * (o.r + 12) && Math.abs(dy) < 40) {
          state.speed *= 0.45;
          state.hits += 1;
          o.y -= 40;
          if (state.cfg.mode === "endless") {
            state.lives -= 1;
            if (state.lives <= 0) finish(false);
          }
        }
      });
      state.world.checks.forEach((c) => {
        if (!c.hit && state.y >= c.y) c.hit = true;
      });
      const pct = Math.min(100, Math.floor((state.y / state.cfg.length) * 100));
      document.getElementById("hud-prog").textContent = pct + "%";
      if (state.cfg.mode !== "endless" && state.y >= state.cfg.length) finish(true);
    }

    function finish(won) {
      if (state.done) return;
      state.done = true;
      state.running = false;
      cancelAnimationFrame(raf);
      const time = (performance.now() - state.t0) / 1000;
      const checkOk = state.world.checks.length === 0 || state.world.checks.every((c) => c.hit);
      const completed = won && checkOk;
      let score = Math.max(0, Math.floor(2000 - time * 22 - state.hits * 40 - state.off * 0.4));
      if (!completed) score = Math.max(0, Math.floor(state.y / 8));
      const body = document.getElementById("result-body");
      body.innerHTML = completed
        ? ("Time: " + time.toFixed(2) + "s<br>Best Time: " + ((bestTime == null || time < bestTime) ? time.toFixed(2) : bestTime.toFixed(2)) + "s<br>Score: " + score + "<br>Hits: " + state.hits)
        : ("Race ended.<br>Distance: " + Math.floor(state.y) + "<br>Score: " + score);
      document.getElementById("play").hidden = true;
      document.getElementById("result").hidden = false;
      save(score, completed, time);
    }

    async function save(score, completed, time) {
      if (submitted) return;
      submitted = true;
      const out = await GameShell.submitRun("minirace", score, 0, 0, {
        game: "minirace", stage: state.stage, mode: state.mode, completed, time, bestTime: time
      });
      const err = document.getElementById("result-err");
      if (out.error) { err.hidden = false; err.textContent = out.error; }
      else {
        err.hidden = true;
        if (out.user && out.user.stats && out.user.stats.minirace) {
          bestTime = out.user.stats.minirace.bestTime;
        }
      }
    }

    function draw() {
      const w = cv.width, h = cv.height;
      ctx.fillStyle = "#102216";
      ctx.fillRect(0, 0, w, h);
      const cam = state.y - 80;
      ctx.fillStyle = "#1f7a3a";
      ctx.fillRect(0, 0, w, h);
      state.world.segs.forEach((s) => {
        const sy = h - (s.y - cam);
        if (sy < -30 || sy > h + 30) return;
        ctx.fillStyle = "#2a2a2a";
        ctx.fillRect(s.cx - s.w / 2, sy - 13, s.w, 26);
        ctx.fillStyle = "#f5d76e";
        ctx.fillRect(s.cx - 1, sy - 10, 2, 12);
      });
      const finY = h - (state.cfg.length - cam);
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, finY, w, 6);
      ctx.fillStyle = "#111";
      ctx.font = "12px Outfit, sans-serif";
      ctx.fillText("FINISH", 12, finY - 6);
      state.world.obstacles.forEach((o) => {
        const oy = h - (o.y - cam);
        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.arc(o.x, oy, o.r, 0, Math.PI * 2);
        ctx.fill();
      });
      const carY = h - (state.y - cam);
      ctx.save();
      ctx.translate(state.x, carY);
      ctx.fillStyle = "#fb923c";
      ctx.fillRect(-10, -16, 20, 28);
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(-7, -10, 14, 8);
      ctx.restore();
    }
  </script>
</body>
</html>
