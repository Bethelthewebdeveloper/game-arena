<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy — Game Arena</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#070b16] text-slate-300 antialiased">
  <main class="mx-auto max-w-2xl px-4 py-16">
    <a href="/" class="inline-flex items-center"><img src="/brand/logo-wordmark.png" alt="Game Arena" width="170" height="54" class="h-8 w-auto sm:h-9" /></a>
    <h1 class="mt-6 text-3xl font-semibold text-white">Privacy</h1>
    <p class="mt-4 text-sm leading-relaxed">Game Arena stores the username and password hash you create, plus the scores, XP, coins and game statistics generated by your play. Session cookies keep you signed in. We do not sell player data. You can stop using the platform at any time.</p>
  </main>
</body>
</html>
