<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Scramble — Game Arena</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style></style>
</head>
<body class="min-h-screen bg-[#070b16] font-sans text-slate-200">
  <main class="mx-auto max-w-xl px-4 py-6">
    <p class="text-xs uppercase tracking-widest text-cyan-300">Game Arena · Word Scramble</p>
    
    <h1 class="mt-1 text-2xl font-semibold text-white">Word Scramble</h1>
    <section id="lobby" class="mt-4"><button id="start" class="min-h-12 w-full rounded-xl bg-cyan-400 font-semibold text-slate-950">Start</button></section>
    <section id="play" hidden>
      <div class="mb-2 flex justify-between text-sm"><span id="hud"></span><span id="time"></span></div>
      <p id="scr" class="rounded-2xl border border-white/10 p-6 text-center text-3xl tracking-[0.3em] text-white"></p>
      <form id="form" class="mt-4 flex gap-2"><input id="ans" class="min-h-12 flex-1 rounded-xl border border-white/10 bg-white/5 px-3" autocomplete="off" /><button class="min-h-12 rounded-xl bg-cyan-400 px-4 font-semibold text-slate-950">Go</button></form>
    </section>
    <section id="result" hidden class="mt-4 rounded-2xl border border-white/10 p-5">
      <h2 class="text-xl font-semibold">RESULTS</h2><p id="rbody" class="mt-2 text-sm leading-7"></p>
      <button id="again" class="mt-4 min-h-11 rounded-xl bg-cyan-400 px-4 font-semibold text-slate-950">Play Again</button>
      <a href="/dashboard" class="ml-2 min-h-11 inline-flex items-center rounded-xl border border-white/15 px-4">Back</a>
    </section>

  </main>
  <script src="/js/arena.js"></script>
  <script src="/js/game-shell.js"></script>
  <script>
    GameShell.mountChrome("WORD SCRAMBLE");
    
    GameShell.guard();
    const WORDS=["arena","puzzle","planet","castle","bridge","orange","silver","memory","player","streak","garden","window","python","rocket","forest"];
    let S,tick;
    function scramble(w){ const a=w.split(""); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a.join("")===w?scramble(w):a.join(""); }
    function start(){
      GameShell.resetSubmit();
      S={i:0,score:0,ok:0,left:45,list:WORDS.slice().sort(()=>Math.random()-0.5).slice(0,8)};
      document.getElementById("lobby").hidden=true; document.getElementById("result").hidden=true; document.getElementById("play").hidden=false;
      show(); clearInterval(tick); tick=setInterval(()=>{ S.left--; document.getElementById("time").textContent=S.left+"s"; if(S.left<=0) finish(); },1000);
    }
    function show(){ const w=S.list[S.i]; document.getElementById("scr").textContent=scramble(w).toUpperCase(); document.getElementById("ans").value=""; document.getElementById("hud").textContent="Round "+(S.i+1)+"/"+S.list.length+" · "+S.score; document.getElementById("time").textContent=S.left+"s"; }
    async function finish(){ clearInterval(tick); document.getElementById("play").hidden=true; document.getElementById("result").hidden=false;
      document.getElementById("rbody").textContent="Score "+S.score+" · Correct "+S.ok+"/"+S.list.length;
      const out=await GameShell.submitRun("wordscramble", S.score,0,0,{completed:S.ok>=4,stage:Math.max(1,S.ok)});
      if(out&&out.awarded) document.getElementById("rbody").textContent+=" · XP +"+out.awarded.xp+" · Coins +"+out.awarded.coins;
    }
    document.getElementById("start").onclick=start; document.getElementById("again").onclick=()=>{document.getElementById("lobby").hidden=false;document.getElementById("result").hidden=true;};
    document.getElementById("form").onsubmit=(e)=>{ e.preventDefault(); const w=S.list[S.i]; if(document.getElementById("ans").value.trim().toLowerCase()===w){ S.ok++; S.score+=20; } S.i++; if(S.i>=S.list.length) finish(); else show(); };

  </script>
</body>
</html>
