<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070b16" />
  <title>Offline — Game Arena</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#070b16] text-slate-200">
  <main class="mx-auto max-w-md px-4 py-24 text-center">
    <h1 class="text-2xl font-semibold text-white">You're offline</h1>
    <p class="mt-3 text-sm text-slate-400">Game Arena needs a connection for login, scores, and progress. Reconnect and try again.</p>
    <a href="/" class="mt-6 inline-block rounded-xl bg-cyan-400 px-4 py-2 font-semibold text-slate-950">Retry</a>
  </main>
</body>
</html>
