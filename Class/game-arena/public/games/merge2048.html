<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>2048 — Game Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script><style>.grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}</style></head>
<body class="min-h-screen bg-[#070b16] font-sans text-slate-200">
<main class="mx-auto max-w-xl px-4 py-6">
<p class="text-xs uppercase tracking-widest text-cyan-300">Game Arena · 2048</p>

<h1 class="mt-1 text-2xl font-semibold text-white">2048</h1>
<p class="text-sm text-slate-400">Swipe or use arrow keys. Merge tiles to 2048.</p>
<div class="mt-3 flex justify-between text-sm"><span id="score">0</span><span id="best">Best —</span></div>
<div id="board" class="mt-3 grid grid-cols-4 gap-2"></div>
<div class="mt-3 grid grid-cols-3 gap-2 sm:hidden">
  <span></span><button class="min-h-12 rounded-xl bg-white/10" data-d="up">▲</button><span></span>
  <button class="min-h-12 rounded-xl bg-white/10" data-d="left">◀</button>
  <button class="min-h-12 rounded-xl bg-white/10" data-d="down">▼</button>
  <button class="min-h-12 rounded-xl bg-white/10" data-d="right">▶</button>
</div>
<section id="over" hidden class="mt-4 rounded-2xl border border-white/10 p-5">
  <h2 class="text-xl font-semibold">GAME OVER</h2><p id="rbody" class="mt-2 text-sm"></p>
  <button id="again" class="mt-4 min-h-11 rounded-xl bg-cyan-400 px-4 font-semibold text-slate-950">Restart</button>
  <a class="ml-2 rounded-xl border border-white/15 px-4 py-2" href="/dashboard">Back</a>
</section>
</main>
<script src="/js/arena.js"></script><script src="/js/game-shell.js"></script>
<script>GameShell.mountChrome("2048");
GameShell.guard().then(u=>{ if(u&&u.stats&&u.stats.merge2048&&u.stats.merge2048.best!=null) document.getElementById("best").textContent="Best "+u.stats.merge2048.best; });
let g,score=0,done=false;
function empty(){ const e=[]; for(let y=0;y<4;y++) for(let x=0;x<4;x++) if(!g[y][x]) e.push([x,y]); return e; }
function spawn(){ const e=empty(); if(!e.length) return; const [x,y]=e[Math.floor(Math.random()*e.length)]; g[y][x]=Math.random()<0.9?2:4; }
function draw(){ const el=document.getElementById("board"); el.innerHTML="";
  for(let y=0;y<4;y++) for(let x=0;x<4;x++){ const v=g[y][x]; const d=document.createElement("div");
    d.className="grid h-16 place-items-center rounded-xl text-lg font-semibold "+(v?"bg-cyan-400/20 text-white":"bg-white/5 text-slate-600");
    d.textContent=v||""; el.appendChild(d); }
  document.getElementById("score").textContent="Score "+score;
}
function slide(row){ const a=row.filter(Boolean); for(let i=0;i<a.length-1;i++){ if(a[i]===a[i+1]){ a[i]*=2; score+=a[i]; a.splice(i+1,1);} } while(a.length<4) a.push(0); return a; }
function move(dir){
  if(done) return;
  const copy=JSON.stringify(g);
  if(dir==="left") g=g.map(slide);
  if(dir==="right") g=g.map(r=>slide(r.slice().reverse()).reverse());
  if(dir==="up"||dir==="down"){
    const t=g[0].map((_,x)=>g.map(r=>r[x]));
    const s=dir==="up"?t.map(slide):t.map(c=>slide(c.slice().reverse()).reverse());
    g=s[0].map((_,y)=>s.map(c=>c[y]));
  }
  if(JSON.stringify(g)!==copy){ spawn(); draw(); if(!empty().length && !canMove()) end(); }
}
function canMove(){ for(let y=0;y<4;y++) for(let x=0;x<4;x++){ if(!g[y][x]) return true; if(x<3&&g[y][x]===g[y][x+1]) return true; if(y<3&&g[y][x]===g[y+1][x]) return true;} return false; }
async function end(){ done=true; document.getElementById("over").hidden=false; document.getElementById("rbody").textContent="Score "+score;
  const out=await GameShell.submitRun("merge2048", score,0,0,{completed:score>=256,stage:Math.min(50,Math.floor(Math.log2(Math.max(2,score))) )});
  if(out&&out.awarded) document.getElementById("rbody").textContent+=" · XP +"+out.awarded.xp; }
function reset(){ GameShell.resetSubmit(); g=Array.from({length:4},()=>[0,0,0,0]); score=0; done=false; document.getElementById("over").hidden=true; spawn(); spawn(); draw(); }
window.addEventListener("keydown",e=>{ const m={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down"}; if(m[e.key]){ e.preventDefault(); move(m[e.key]); }});
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>move(b.dataset.d));
let sx,sy; document.getElementById("board").addEventListener("touchstart",e=>{sx=e.touches[0].clientX; sy=e.touches[0].clientY;},{passive:true});
document.getElementById("board").addEventListener("touchend",e=>{ const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; if(Math.abs(dx)+Math.abs(dy)<24) return; if(Math.abs(dx)>Math.abs(dy)) move(dx>0?"right":"left"); else move(dy>0?"down":"up"); });
document.getElementById("again").onclick=reset; reset();
</script></body></html>
