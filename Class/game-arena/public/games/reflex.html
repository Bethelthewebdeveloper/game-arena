<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reflex Challenge — Game Arena</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .arena {
      background:
        radial-gradient(circle at 50% 50%, rgba(244,63,94,.12), transparent 55%),
        #12080c;
    }
    .tgt {
      position: absolute;
      width: 72px; height: 72px; border-radius: 999px;
      border: 3px solid #fb7185;
      background: radial-gradient(circle, #fff 0 12%, #fb7185 13% 38%, #fff 39% 52%, #fb7185 53% 100%);
      box-shadow: 0 0 18px rgba(251,113,133,.45);
      animation: pop .18s ease-out;
      touch-action: manipulation;
    }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .tgt.hit { transform: scale(1.2); opacity: 0; transition: .12s; }
  </style>
</head>
<body class="min-h-screen bg-[#140b10] font-sans text-slate-200">
  <main class="mx-auto max-w-xl px-4 py-6">
    <p class="text-xs uppercase tracking-widest text-rose-300">Game Arena · Reflex Challenge</p>
    <h1 class="mt-1 text-2xl font-semibold text-white">Hit the moving mark</h1>
    <p class="mt-1 text-sm text-slate-400">Hits <span id="score">0</span> · <span id="time">20</span>s</p>
    <div id="field" class="arena relative mt-4 h-80 overflow-hidden rounded-2xl border border-rose-400/20"></div>
    <button id="start" class="mt-4 min-h-11 rounded-xl bg-rose-400 px-4 py-2 font-semibold text-slate-950">Start</button>
    <section id="result" hidden class="mt-6 rounded-2xl border border-rose-400/20 p-5">
      <h2 class="text-xl font-semibold text-white">TIME UP</h2>
      <p id="rbody" class="mt-3 text-sm leading-7"></p>
      <div class="mt-4 flex flex-wrap gap-2">
        <button id="again" class="min-h-11 rounded-xl bg-rose-400 px-4 py-2 font-semibold text-slate-950">Play Again</button>
        <a href="/dashboard" class="min-h-11 inline-flex items-center rounded-xl border border-white/15 px-4 py-2">Back to Games</a>
      </div>
    </section>
  </main>
  <script src="/js/arena.js"></script>
  <script src="/js/game-shell.js"></script>
  <script>
    GameShell.mountChrome("REFLEX CHALLENGE");
    GameShell.guard();
    let score = 0, playing = false, timer = null, mover = null;
    const field = document.getElementById("field");
    window.__gaCleanup = () => { playing = false; clearInterval(timer); clearInterval(mover); };
    function endGame() {
      playing = false; clearInterval(timer); clearInterval(mover); field.innerHTML = "";
      document.getElementById("rbody").textContent = "Hits: " + score;
      document.getElementById("result").hidden = false;
      GameShell.submitRun("reflex", score, 0, 0, { completed: score >= 8, stage: 1 });
    }
    function spawn() {
      if (!playing) return;
      field.innerHTML = "";
      const t = document.createElement("button");
      t.className = "tgt";
      t.style.left = (8 + Math.random() * 70) + "%";
      t.style.top = (8 + Math.random() * 68) + "%";
      t.setAttribute("aria-label", "Target");
      t.onclick = () => {
        if (!playing) return;
        t.classList.add("hit");
        score += 1;
        document.getElementById("score").textContent = score;
        setTimeout(spawn, 40);
      };
      field.appendChild(t);
    }
    document.getElementById("start").onclick = start;
    document.getElementById("again").onclick = () => { GameShell.resetSubmit(); document.getElementById("result").hidden = true; start(); };
    function start() {
      if (playing) return;
      playing = true; score = 0;
      document.getElementById("score").textContent = "0";
      document.getElementById("result").hidden = true;
      let t = 20;
      document.getElementById("time").textContent = t;
      timer = setInterval(() => { t -= 1; document.getElementById("time").textContent = t; if (t <= 0) endGame(); }, 1000);
      spawn();
      mover = setInterval(() => { if (playing) spawn(); }, 850);
    }
  </script>
</body>
</html>
