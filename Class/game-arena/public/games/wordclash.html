<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Clash — Game Arena</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#0d1408] font-sans text-slate-200">
  <main class="mx-auto max-w-xl px-4 py-6">
    <p class="text-xs uppercase tracking-widest text-lime-300">Game Arena · Word Clash</p>
    <h1 class="mt-1 text-2xl font-semibold text-white">Build the word</h1>
    <section id="lobby" class="mt-5 space-y-3">
      <select id="mode" class="min-h-11 w-full rounded-xl border border-lime-400/20 bg-black/30 px-3">
        <option value="unscramble">Unscramble</option>
        <option value="complete">Complete the Word</option>
        <option value="letters">Word from Letters</option>
        <option value="fast">Fast Word</option>
        <option value="chain">Word Chain</option>
      </select>
      <button id="go" class="min-h-12 w-full rounded-xl bg-lime-400 font-semibold text-slate-950">Play</button>
    </section>
    <section id="play" hidden>
      <p class="text-sm">Time <span id="time">40</span>s · Score <span id="score">0</span> · Combo <span id="combo">0</span></p>
      <p id="hint" class="mt-3 text-sm text-lime-200/80"></p>
      <div id="tiles" class="mt-4 flex flex-wrap justify-center gap-2"></div>
      <form id="form" class="mt-5 flex gap-2">
        <input id="guess" class="min-h-12 flex-1 rounded-xl border border-lime-400/20 bg-black/30 px-3" aria-label="Word" />
        <button class="min-h-12 rounded-xl bg-lime-400 px-4 font-semibold text-slate-950">Send</button>
      </form>
      <p id="msg" class="mt-3 min-h-6 text-sm"></p>
    </section>
    <section id="result" hidden class="mt-6 rounded-2xl border border-lime-400/20 p-5">
      <h2 class="text-xl font-semibold text-white">WORD CLASH COMPLETE</h2>
      <p id="rbody" class="mt-3 text-sm leading-7"></p>
      <div class="mt-4 flex flex-wrap gap-2">
        <button id="again" class="min-h-11 rounded-xl bg-lime-400 px-4 font-semibold text-slate-950">Play Again</button>
        <a href="/dashboard" class="min-h-11 inline-flex items-center rounded-xl border border-white/15 px-4">Back to Games</a>
      </div>
    </section>
  </main>
  <script src="/js/arena.js"></script>
  <script src="/js/game-shell.js"></script>
  <script>
    GameShell.mountChrome("WORD CLASH");
    GameShell.guard();
    const WORDS=["arena","level","streak","puzzle","reflex","memory","trophy","player","goal","code","pattern","number"];
    let S, tick;
    window.__gaCleanup=()=>clearInterval(tick);
    function scramble(w){ let a=w.split(""); do{a=a.sort(()=>Math.random()-0.5);}while(a.join("")===w); return a.join(""); }
    function tiles(s){ document.getElementById("tiles").innerHTML=s.split("").map(ch=>'<button type="button" class="grid h-12 w-12 place-items-center rounded-xl border border-lime-400/30 bg-lime-400/10 font-mono text-xl font-bold">'+ch.toUpperCase()+"</button>").join("");
      document.querySelectorAll("#tiles button").forEach(b=>b.onclick=()=>{ document.getElementById("guess").value+=b.textContent.toLowerCase(); }); }
    function challenge(){
      const w=S.list[S.i%S.list.length];
      S.target=w;
      if(S.mode==="complete"){
        const cut=Math.max(2,Math.floor(w.length/2));
        tiles(w.slice(0,cut)+"_".repeat(w.length-cut));
        document.getElementById("hint").textContent="Finish the word.";
      } else if(S.mode==="letters"||S.mode==="fast"||S.mode==="unscramble"){
        tiles(scramble(w));
        document.getElementById("hint").textContent="Unscramble these letters.";
      } else {
        const prev=S.last||"arena";
        document.getElementById("hint").textContent="Next word must start with “"+prev.slice(-1)+"”.";
        tiles(prev.slice(-1)+"...");
        S.target=null; S.need=prev.slice(-1);
      }
    }
    document.getElementById("go").onclick=()=>{
      GameShell.resetSubmit();
      clearInterval(tick);
      S={mode:document.getElementById("mode").value,list:WORDS.slice().sort(()=>Math.random()-0.5),i:0,score:0,combo:0,done:false,last:"arena"};
      document.getElementById("lobby").hidden=true;
      document.getElementById("result").hidden=true;
      document.getElementById("play").hidden=false;
      document.getElementById("score").textContent=0;
      let t=S.mode==="fast"?25:40;
      document.getElementById("time").textContent=t;
      challenge();
      tick=setInterval(()=>{ t--; document.getElementById("time").textContent=t; if(t<=0) finish(); },1000);
    };
    document.getElementById("again").onclick=()=>{ document.getElementById("lobby").hidden=false; document.getElementById("play").hidden=true; document.getElementById("result").hidden=true; };
    document.getElementById("form").onsubmit=(e)=>{
      e.preventDefault();
      if(!S||S.done) return;
      const g=document.getElementById("guess").value.trim().toLowerCase();
      document.getElementById("guess").value="";
      let ok=false;
      if(S.mode==="chain") ok=g.length>=3 && g[0]===S.need && WORDS.includes(g);
      else ok=g===S.target;
      if(ok){
        S.combo+=1; S.score+=8+S.combo; S.i+=1; S.last=g;
        document.getElementById("msg").textContent="Yes.";
        document.getElementById("score").textContent=S.score;
        document.getElementById("combo").textContent=S.combo;
        challenge();
      } else { S.combo=0; document.getElementById("combo").textContent=0; document.getElementById("msg").textContent="Not it."; }
    };
    async function finish(){
      if(S.done) return; S.done=true; clearInterval(tick);
      document.getElementById("play").hidden=true;
      document.getElementById("result").hidden=false;
      document.getElementById("rbody").textContent="Score "+S.score+" · Mode "+S.mode;
      await GameShell.submitRun("wordclash", S.score, 0, 0, { completed:S.score>=16, stage:S.i, mode:S.mode });
    }
  </script>
</body>
</html>
