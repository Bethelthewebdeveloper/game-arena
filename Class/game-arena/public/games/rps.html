<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Paper Scissors — Game Arena</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .arena-you { background: linear-gradient(180deg,#1b1230,#140b18); }
    .arena-ai { background: linear-gradient(180deg,#1a1020,#2a1230); }
    .choice-slot {
      height: 140px;
      display: grid; place-items: center;
      border-radius: 1.25rem;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.25);
      font-size: 3.4rem;
      transition: transform .2s ease, background .2s ease;
    }
    .choice-slot.pop { transform: scale(1.06); }
  </style>
</head>
<body class="min-h-screen bg-[#140b18] font-sans text-slate-200">
  <main class="mx-auto max-w-2xl px-4 py-6">
    <p class="text-xs uppercase tracking-widest text-fuchsia-300">Game Arena · Rock Paper Scissors</p>
    <h1 class="mt-1 text-2xl font-semibold text-white">Best of five</h1>
    <p class="mt-1 text-sm text-slate-400">First to 3 wins. Pick your move.</p>

    <div id="play" class="mt-5 grid gap-3 sm:grid-cols-[1fr_auto_1fr] sm:items-stretch">
      <section class="arena-you rounded-2xl border border-cyan-400/20 p-4">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-semibold tracking-wide text-cyan-200">YOU</h2>
          <p class="text-2xl font-bold text-white" id="you">0</p>
        </div>
        <div id="you-slot" class="choice-slot mt-3 text-cyan-100">?</div>
        <p id="you-label" class="mt-2 text-center text-xs uppercase tracking-widest text-slate-400">Waiting</p>
      </section>
      <div class="grid place-items-center py-1">
        <span class="rounded-full border border-white/15 px-3 py-1 text-xs font-semibold text-white">VS</span>
      </div>
      <section class="arena-ai rounded-2xl border border-rose-400/20 p-4">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-semibold tracking-wide text-rose-200">AI</h2>
          <p class="text-2xl font-bold text-white" id="cpu">0</p>
        </div>
        <div id="ai-slot" class="choice-slot mt-3 text-rose-100">?</div>
        <p id="ai-label" class="mt-2 text-center text-xs uppercase tracking-widest text-slate-400">Waiting</p>
      </section>
    </div>

    <p id="msg" class="mt-4 text-center text-sm text-slate-300">Choose rock, paper, or scissors.</p>
    <div id="controls" class="mt-4 grid grid-cols-3 gap-2">
      <button data-m="rock" class="min-h-[72px] rounded-2xl border border-white/10 bg-white/5 text-sm font-semibold">✊ Rock</button>
      <button data-m="paper" class="min-h-[72px] rounded-2xl border border-white/10 bg-white/5 text-sm font-semibold">✋ Paper</button>
      <button data-m="scissors" class="min-h-[72px] rounded-2xl border border-white/10 bg-white/5 text-sm font-semibold">✌️ Scissors</button>
    </div>

    <section id="result" hidden class="mt-6 rounded-2xl border border-fuchsia-400/25 bg-fuchsia-500/5 p-5">
      <h2 id="rtitle" class="text-xl font-semibold text-white">Match over</h2>
      <p id="rbody" class="mt-3 text-sm leading-7 text-slate-300"></p>
      <p id="rerr" class="mt-2 hidden text-sm text-rose-300"></p>
      <div class="mt-5 flex flex-wrap gap-2">
        <button id="again" class="min-h-11 rounded-xl bg-fuchsia-400 px-4 py-2 font-semibold text-slate-950">Play Again</button>
        <a href="/dashboard" class="min-h-11 inline-flex items-center rounded-xl border border-white/15 px-4 py-2">Back to Games</a>
      </div>
    </section>
  </main>
  <script src="/js/arena.js"></script>
  <script src="/js/game-shell.js"></script>
  <script>
    GameShell.mountChrome("ROCK PAPER SCISSORS");
    GameShell.guard();
    const icon = { rock: "✊", paper: "✋", scissors: "✌️" };
    const beats = { rock: "scissors", paper: "rock", scissors: "paper" };
    const moves = ["rock", "paper", "scissors"];
    let you = 0, cpu = 0, over = false, saved = false, lock = false;

    function resetMatch() {
      GameShell.resetSubmit();
      you = 0; cpu = 0; over = false; saved = false; lock = false;
      document.getElementById("you").textContent = "0";
      document.getElementById("cpu").textContent = "0";
      document.getElementById("you-slot").textContent = "?";
      document.getElementById("ai-slot").textContent = "?";
      document.getElementById("you-label").textContent = "Waiting";
      document.getElementById("ai-label").textContent = "Waiting";
      document.getElementById("msg").textContent = "New match. Choose your move.";
      document.getElementById("controls").hidden = false;
      document.getElementById("result").hidden = true;
    }
    document.getElementById("again").onclick = resetMatch;

    document.querySelectorAll("[data-m]").forEach((btn) => {
      btn.onclick = async () => {
        if (over || lock) return;
        lock = true;
        const mine = btn.dataset.m;
        const theirs = moves[Math.floor(Math.random() * 3)];
        const ys = document.getElementById("you-slot");
        const as = document.getElementById("ai-slot");
        ys.textContent = icon[mine]; ys.classList.add("pop");
        as.textContent = "…";
        document.getElementById("you-label").textContent = mine;
        document.getElementById("ai-label").textContent = "Choosing";
        await new Promise((r) => setTimeout(r, 280));
        as.textContent = icon[theirs]; as.classList.add("pop");
        document.getElementById("ai-label").textContent = theirs;
        let line = "Draw.";
        if (mine === theirs) line = "Draw. Same move.";
        else if (beats[mine] === theirs) { you += 1; line = "You take the round."; }
        else { cpu += 1; line = "AI takes the round."; }
        document.getElementById("you").textContent = you;
        document.getElementById("cpu").textContent = cpu;
        document.getElementById("msg").textContent = line;
        setTimeout(() => { ys.classList.remove("pop"); as.classList.remove("pop"); lock = false; }, 250);
        if (you === 3 || cpu === 3) {
          over = true;
          lock = true;
          const won = you > cpu;
          const score = you * 10;
          document.getElementById("controls").hidden = true;
          document.getElementById("result").hidden = false;
          document.getElementById("rtitle").textContent = won ? "YOU WIN THE MATCH" : "AI WINS THE MATCH";
          document.getElementById("rbody").innerHTML =
            "Final result: " + (won ? "Victory" : "Defeat") +
            "<br>Your score: " + you +
            "<br>AI score: " + cpu +
            "<br>Match points: " + score;
          if (!saved) {
            saved = true;
            const out = await GameShell.submitRun("rps", score, 0, 0, { completed: won, stage: 1, mode: "best-of-five" });
            const err = document.getElementById("rerr");
            if (out.error) { err.hidden = false; err.textContent = out.error; }
          }
        }
      };
    });
  </script>
</body>
</html>
